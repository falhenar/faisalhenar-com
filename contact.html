<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Contact — Faisal Henar</title>
<meta name="description" content="Get in touch.">
<link rel="stylesheet" href="css/hub.css?v=2">
<link rel="stylesheet" href="css/note.css?v=1">
</head>
<body>

  <header class="note-top">
    <a class="mark" href="index.html">Faisal Henar</a>
    <div class="menu" data-menu>
      <button class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="site-menu-panel" data-menu-btn>Menu</button>
      <nav class="menu-panel" id="site-menu-panel" data-menu-panel aria-label="Site sections" hidden>
        <a href="index.html">Home</a>
        <a href="photography/index.html">Photography</a>
        <a href="practice/index.html">Practice</a>
      </nav>
    </div>
  </header>

  <main class="note">
    <p class="note-lead">Get in touch.</p>

    <div class="note-body">
      <p>This page is still being written. In the meantime, feel free to reach out <a href="mailto:faisal@faisalhenar.com">by email</a>.</p>
    </div>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav" aria-label="More">
      <a href="note.html">A note from me</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="footer-meta">
      <span>© <span id="year"></span> Faisal Henar</span>
      <span>Built quietly, updated slowly</span>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script>
  (function(){
    document.querySelectorAll('[data-menu]').forEach(function(menu){
      var btn = menu.querySelector('[data-menu-btn]');
      var panel = menu.querySelector('[data-menu-panel]');
      function closeMenu(){
        panel.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
      }
      function openMenu(){
        panel.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
      }
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if (panel.hidden) openMenu(); else closeMenu();
      });
      document.addEventListener('click', function(e){
        if (!menu.contains(e.target)) closeMenu();
      });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && !panel.hidden){
          closeMenu();
          btn.focus();
        }
      });
    });
  })();
  </script>
</body>
</html>
