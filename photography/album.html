  <div class="sprocket-strip top" aria-hidden="true"></div>

  <header class="site-header">

      <a href="index.html">Faisal Henar</a>
    </div>
    <div class="site-header-right">
      <div class="section-label">Photography</div>
      <div class="menu" data-menu>
        <button class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="site-menu-panel" data-menu-btn>Menu</button>

  <section class="album-header">
    <a class="back-link" href="index.html">&larr; All albums</a>
    <h1 id="album-title">Album</h1>
    <p class="album-meta" id="album-meta"></p>
  </section>

  <main class="roll" id="roll">
    <!-- exposures rendered here by js/render-album.js -->
  </main>

  <nav class="roll-end" id="roll-end" aria-label="Album navigation">
    <!-- end-of-roll marker and next album rendered here by js/render-album.js -->
  </nav>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lightbox-stage" id="lightbox-stage">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div class="lightbox-controls">
      <button class="lightbox-btn" id="lightbox-fullscreen" type="button" aria-pressed="false" hidden>Full screen</button>
      <button class="lightbox-btn" id="lightbox-close" type="button">Close &times;</button>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photo">&larr;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next photo">&rarr;</button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <footer class="site-footer">
    <span>© <span id="year"></span> Faisal Henar</span>
  </footer>

  <div class="sprocket-strip bottom" aria-hidden="true"></div>
