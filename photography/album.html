<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album · Faisal Henar Photography</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <div class="sprocket-strip top" aria-hidden="true"></div>

  <header class="site-header">
    <div class="mark">
      <a href="index.html">Faisal Henar</a>
    </div>
    <div class="site-header-right">
      <div class="section-label">Photography</div>
      <div class="menu" data-menu>
        <button class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="site-menu-panel" data-menu-btn>Menu</button>
        <nav class="menu-panel" id="site-menu-panel" data-menu-panel aria-label="Site sections" hidden>
          <a href="../index.html">Home</a>
          <a href="index.html" class="current">Photography</a>
          <a href="../practice/index.html">Practice</a>
        </nav>
      </div>
    </div>
  </header>

  <section class="album-header">
    <a class="back-link" href="index.html">&larr; All albums</a>
    <h1 id="album-title">Album</h1>
    <p class="album-meta" id="album-meta"></p>
  </section>

  <main class="roll" id="roll">
    <!-- exposures rendered here by js/render-album.js -->
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">Close &times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&larr;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&rarr;</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <footer class="site-footer">
    <span>© <span id="year"></span> Faisal Henar</span>
    <span class="mono" id="footer-tag">Black &amp; White</span>
  </footer>

  <div class="sprocket-strip bottom" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/render-album.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script>
  (function(){
    document.querySelectorAll('[data-menu]').forEach(function(menu){
      var btn = menu.querySelector('[data-menu-btn]');
      var panel = menu.querySelector('[data-menu-panel]');
      function closeMenu(){
        panel.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
      }
      function openMenu(){
        panel.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
      }
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if (panel.hidden) openMenu(); else closeMenu();
      });
      document.addEventListener('click', function(e){
        if (!menu.contains(e.target)) closeMenu();
      });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && !panel.hidden){
          closeMenu();
          btn.focus();
        }
      });
    });
  })();
  </script>
</body>
</html>
