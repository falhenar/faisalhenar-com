<title>Sati Timer · Xem lại bản tiếng Việt</title>
<style>
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage';font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-600-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Bricolage';font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-600-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Bricolage';font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --paper:#E8EBE3;--card:#F4F6F0;--ink:#1B241F;--ink-soft:#5A6660;--river:#2E4A44;--river-lift:#3D6159;
  --ochre:#C08A2E;--ochre-text:#8A6118;--clay:#8C4A3A;--mist:#CBD3C6;--mist-soft:#DFE4D9;--on-river:#F4F6F0;
  --ok:#2E4A44;--fix:#8C4A3A;--unsure:#8A6118;--fs:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B241F;--card:#232E29;--ink:#E8EBE3;--ink-soft:#B7C0BA;--river:#7FA89D;--river-lift:#94BBB0;
  --ochre:#D9A548;--ochre-text:#D9A548;--clay:#C97B64;--mist:#3A443E;--mist-soft:#2C3830;--on-river:#1B241F;
  --ok:#7FA89D;--fix:#C97B64;--unsure:#D9A548;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plex',system-ui,sans-serif;font-size:calc(17px*var(--fs));line-height:1.6;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Bricolage','Plex',sans-serif;font-weight:600;line-height:1.3;margin:0}
h1{font-size:1.65em;color:var(--river)}
h2{font-size:1.3em}
.dot{color:var(--ochre)}
p{margin:.6em 0}
.muted{color:var(--ink-soft)}
.small{font-size:.86em}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--mist);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bar-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--mist-soft)}
.progress{height:4px;background:var(--mist);border-radius:2px;overflow:hidden;max-width:640px;margin:8px auto 0}
.progress>i{display:block;height:100%;background:var(--ochre);transition:width .3s}
.save{font-size:.78em;color:var(--ink-soft);white-space:nowrap}
.save.warn{color:var(--clay)}

/* cards */
.card{background:var(--card);border:1px solid var(--mist);border-radius:18px;padding:18px;margin:16px 0}
.where{font-size:.8em;color:var(--ink-soft);letter-spacing:.01em;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.where .count{flex:none;font-variant-numeric:tabular-nums}
.vi{font-size:1.18em;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.vi.long{font-size:1.06em}
.kind-heading .vi,.kind-term .vi{font-family:'Bricolage','Plex',sans-serif;font-weight:600;font-size:1.35em;color:var(--river)}
.kind-callout .vi::first-line{font-weight:600}
.noting{color:var(--ochre-text);font-weight:600}
.ph{background:var(--mist-soft);border-radius:4px;padding:0 3px}
.fig{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff;border-radius:12px;padding:10px;margin-bottom:12px}
.pali{font-style:italic;color:var(--ink-soft);margin-bottom:6px}
.en-toggle{margin-top:14px;border:0;background:none;color:var(--river);padding:8px 0;cursor:pointer;font-size:.9em;text-decoration:underline;text-underline-offset:3px}
.en{margin-top:6px;padding:12px 14px;border-left:3px solid var(--mist);color:var(--ink-soft);white-space:pre-wrap;font-size:.95em}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--mist-soft);font-size:.92em}
.note b{color:var(--river)}

/* answer buttons */
.answers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px}
.ans{border:2px solid var(--mist);background:var(--card);border-radius:16px;min-height:64px;padding:8px 6px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.25}
.ans small{font-weight:400;font-size:.72em;color:var(--ink-soft)}
.ans.ok{border-color:var(--ok);color:var(--ok)}
.ans.fix{border-color:var(--fix);color:var(--fix)}
.ans.unsure{border-color:var(--unsure);color:var(--unsure)}
.ans.sel.ok{background:var(--ok);color:var(--on-river)}
.ans.sel.fix{background:var(--fix);color:var(--on-river)}
.ans.sel.unsure{background:var(--unsure);color:var(--on-river)}
.ans.sel small{color:inherit}
.ans:active{transform:scale(.98)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;border:0;background:var(--river);color:var(--on-river);font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--river);border:2px solid var(--mist)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}

label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:.92em}
textarea,input[type=text]{width:100%;border:2px solid var(--mist);border-radius:12px;background:var(--paper);padding:12px;line-height:1.55;font-size:1em}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--river)}
textarea{min-height:110px;resize:vertical}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.link{border:0;background:none;color:var(--river);cursor:pointer;padding:12px 4px;font-size:.92em}
.link:disabled{color:var(--mist);cursor:default}

/* chapter list */
.chap{display:block;width:100%;text-align:left;cursor:pointer;color:inherit}
.chap h3{font-size:1.1em;margin-bottom:2px}
.chap .meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:.84em;color:var(--ink-soft)}
.chap.done{border-color:var(--river)}
.badge{display:inline-block;font-size:.75em;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--mist-soft);color:var(--river)}
.chap.done .badge{background:var(--river);color:var(--on-river)}
.mini{height:4px;background:var(--mist);border-radius:2px;margin-top:8px;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--ochre)}

/* quick list */
.q{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--mist);cursor:pointer}

.q .mark{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ok);display:flex;align-items:center;justify-content:center;color:var(--ok);font-size:.9em;margin-top:2px}
.q.flag .mark{border-color:var(--fix);background:var(--fix);color:var(--on-river)}
.q .t{flex:1;min-width:0}
.q .qv{font-weight:600}
.q .qe{font-size:.82em;color:var(--ink-soft)}
.qhead{font-size:.8em;font-weight:600;color:var(--river);margin:18px 0 0;padding-bottom:4px;border-bottom:1px solid var(--mist)}
.q .qedit{margin-top:8px}

ul.how{padding-left:1.1em;margin:.6em 0}
ul.how li{margin:.45em 0}
.banner{background:var(--ochre);color:#1B241F;font-size:.85em;text-align:center;padding:6px 12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sizes{display:flex;gap:8px}
.sizes button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--mist);background:var(--paper);cursor:pointer}
.sizes button.on{border-color:var(--river);color:var(--river);font-weight:600}
.copy{word-break:break-all;font-size:.85em;background:var(--paper);border-radius:10px;padding:10px;border:1px solid var(--mist)}
.center{text-align:center}
.shot{margin:16px 0 0;cursor:zoom-in}
.shot-win{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--mist);background:#F4F6F0}
.shot-win img{display:block;width:100%;height:auto;will-change:transform}
.hl{position:absolute;border:3px solid var(--ochre);border-radius:8px;box-shadow:0 0 0 9999px rgba(27,36,31,.18);pointer-events:none}
.viewer-page .hl{box-shadow:none;background:rgba(192,138,46,.12)}
.shot figcaption{display:flex;justify-content:space-between;gap:10px;font-size:.78em;color:var(--ink-soft);margin-top:6px}
.shot .zoom{color:var(--river);font-weight:600;white-space:nowrap}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(15,20,18,.92);display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#E8EBE3;padding:calc(6px + env(safe-area-inset-top)) 8px 6px 16px;font-weight:600;font-size:.92em}
.viewer-bar .iconbtn{color:#E8EBE3;font-size:1.2em}
.viewer-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
.viewer-page{position:relative;max-width:480px;margin:0 auto}
.viewer-page img{display:block;width:100%;height:auto;border-radius:16px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qsee{padding:4px 0;font-size:1em;white-space:nowrap}
.tour{padding-top:calc(18px + env(safe-area-inset-top));text-align:center}
.tour-top{display:flex;justify-content:space-between;align-items:center}
.phone{margin:8px auto 0;width:min(270px, calc(54vh * 0.4613 + 16px));border-radius:30px;padding:8px;background:#1B241F;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone img{display:block;width:100%;height:auto;border-radius:23px}
.tour-text{font-size:1.08em;line-height:1.6;margin:18px 4px 10px;min-height:5.2em}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mist)}
.dots i.on{background:var(--ochre)}
.tourcard img{border-radius:8px;border:1px solid var(--mist);flex:none}
.hidden{display:none!important}
.refs{list-style:none;padding:0;margin:8px 0 0}
.refs li{padding:10px 0;border-bottom:1px solid var(--mist)}
.refs li:last-child{border-bottom:0}
.refs a,.chrefs a{color:var(--river);font-weight:600;text-underline-offset:3px}
.refbox summary{cursor:pointer;min-height:28px}
.chrefs{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;padding-top:12px;border-top:1px solid var(--mist);font-size:.88em}
.kind-step .vi .noting:first-child{font-size:1.15em}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress>i{transition:none}}
</style>
</head>
<body>
<div id="demo" class="banner hidden">Chế độ thử: câu trả lời chỉ được lưu trên máy này.</div>
<div id="app"><div class="wrap"><p class="muted" style="padding-top:40px">Đang tải…</p></div></div>
