name: No em dashes

# Runs on every push to main, whoever made it: you, the GitHub web editor,
# or an assistant. Reports what it finds and fails loudly (you get an email
# from GitHub) so the correction is made deliberately.
#
# This workflow deliberately does not repair anything. It used to run with
# --fix, commit the result and push it to main. tools/no-em-dash.py is careful
# about what it will touch (verbatim quotation is exempt, see QUOTE_FIELDS),
# but as STYLE.md says, automatic repair picks a comma every time and a comma
# is often not the right mark. On a site whose point is the writing, the
# author should choose the punctuation, not the runner. Reading the failure
# and fixing the line by hand takes a minute and produces a better sentence.
#
# The report is written to the runner's temp directory, not the repository,
# so no scan artefact is ever committed or published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check visible copy
        id: check
        run: |
          set +e
          python3 tools/no-em-dash.py > "$RUNNER_TEMP/report.txt" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Em dash check'
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if anything was found
        if: steps.check.outputs.status != '0'
        run: |
          echo "Em dashes found in visible copy. See the summary above for the file and line."
          echo "Fix them by hand: prefer rewriting the sentence, then a colon or a full stop."
          echo "Verbatim quotation is exempt and the script already skips it."
          exit 1
