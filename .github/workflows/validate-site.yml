name: Validate public website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the validator
        run: python3 -m unittest discover -s tools/tests -v

      - name: Validate the complete public website
        run: python3 tools/validate-site.py
