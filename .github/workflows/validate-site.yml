name: Validate public website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the validator
        run: python3 -m unittest discover -s tools/tests -v
      
      - name: Check the generated Reflection pages are current
        run: |
          python3 tools/build-reflections.py
          if ! git diff --quiet; then
            echo "The generated Reflection pages are out of date."
            echo "Run: python3 tools/build-reflections.py, then commit the result."
            git --no-pager diff --stat
            exit 1
          fi
      
      - name: Validate the complete public website
        run: python3 tools/validate-site.py
